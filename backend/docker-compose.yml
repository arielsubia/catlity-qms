services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: catlity
      POSTGRES_PASSWORD: catlity_dev
      POSTGRES_DB: catlity_qms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catlity -d catlity_qms"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql://catlity:catlity_dev@db:5432/catlity_qms
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
